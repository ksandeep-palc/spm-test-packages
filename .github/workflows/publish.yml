name: publish-spm-test-packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["1.0.0", "1.1.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image name and manifest
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/spm-test-pkg" >> "$GITHUB_OUTPUT"
          echo "manifest=$(./spm-test-pkg/manifest.sh ${{ matrix.version }})" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: spm-test-pkg
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: MANIFEST=${{ steps.meta.outputs.manifest }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ matrix.version }}
            ${{ matrix.version == '1.1.0' && format('{0}:latest', steps.meta.outputs.image) || '' }}
